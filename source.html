<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D Viewer</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        accent-color: oklch(var(--primary-color));
        font-size: 1rem;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;

        --bg-color: 0% 0 0;
        --fg-color: 100% 0 0;
        --primary-color: 0.62 0.12 199.54;
        --primary-fg-color: 1 0 0;
        --secondary-color: 0.4203 0.1014 262.52;
        --secondary-fg-color: 1 0 0;
        background: oklch(var(--bg-color));
        color: oklch(var(--fg-color));
      }

      live2d-viewer {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>

    <!-- Required Live2D & PixiJS Libraries -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <live2d-viewer></live2d-viewer>

    <script type="module">
      import {
        LitElement,
        html,
        css
      } from "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js";

      const DEFAULT_MODEL =
        "/assets/assetbundles/actor2d/character/10301/live2d/talent/10301_talent.model3.json";

      class Live2DViewer extends LitElement {
        static properties = {
          selectedModelPath: { type: String },
          motionGroups: { type: Array },
          selectedGroup: { type: String },
          motions: { type: Array },
          selectedMotion: { type: String },
          expressions: { type: Array },
          selectedExpression: { type: String },
          scale: { type: Number },
          resolution: { type: String },
          exportResolution: { type: String },
          customWidth: { type: Number },
          customHeight: { type: Number },
          showFramingPreview: { type: Boolean },
          mouseTracking: { type: Boolean },
          statusMsg: { type: String },
          isDragging: { type: Boolean },
          isRecording: { type: Boolean },
          panX: { type: Number },
          panY: { type: Number }
        };

        static styles = css`
          :host {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            --small-screen-sheet-height: 35vh;
          }

          * {
            box-sizing: border-box;
          }

          canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
          }

          #viewport {
            cursor: grab;
            &:active {
              cursor: grabbing;
            }
          }

          aside,
          footer {
            position: absolute;
            z-index: 10;
            background: oklch(var(--bg-color) / 0.6);
            backdrop-filter: blur(4px);
          }

          aside {
            top: 0;
            left: 0;
            width: 320px;
            max-height: calc(100vh - 32px);
            padding: 4px;
            border-radius: 6px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
          }

          footer {
            right: 0;
            top: 0;
          }

          form {
            display: flex;
            flex-direction: column;
          }

          .control-group {
            display: flex;
            flex-direction: column;
          }

          .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            overflow-y: auto;
          }

          .tile-btn {
            border: none;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-height: 32px;
          }
          .tile-btn:focus-visible {
            outline: 2px solid oklch(var(--primary-color));
            outline-offset: 2px;
          }

          .tile-btn.active {
            background: oklch(var(--secondary-color));
            color: oklch(var(--secondary-fg-color));
          }

          .tile-btn.active:hover {
            background: oklch(var(--secondary-color) / 0.9);
          }

          .empty-state {
            grid-column: 1 / -1;
            font-size: 0.8rem;
            opacity: 0.5;
          }

          select,
          input[type="number"],
          button {
            background: transparent;
            color: inherit;
            font: inherit;
            border: 1px solid oklch(var(--fg-color) / 0.5);
            padding: 0.1rem;

            &:not(:disabled):where(:hover) {
              background: oklch(var(--fg-color) / 0.1);
            }
          }

          select option {
            background: oklch(var(--bg-color));
            color: inherit;
          }

          button {
            cursor: pointer;
            border-radius: 4px;
          }

          .row-group {
            display: flex;
            gap: 4px;
            align-items: end;
          }

          .row-custom {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
          }

          .input-item {
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 4px;
            flex: 1;
          }

          .input-item label {
            color: oklch(var(--fg-color) / 0.8);
          }

          .toggle-row {
            display: flex;
            align-items: center;
          }

          .toggle-row label {
            flex-grow: 1;
          }

          .checkbox-custom {
            width: 16px;
            height: 16px;
            margin: 0;
            cursor: pointer;
          }

          .section-label {
            padding: 0 0.25rem;
          }

          .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
          }

          .drop-btn {
            grid-column: 1 / -1;
            background: oklch(var(--primary-color));
            color: oklch(var(--primary-fg-color));
            border: none;
          }
          .drop-btn:hover:not(:disabled) {
            background: oklch(var(--primary-color) / 0.9);
          }

          kbd {
            display: none;
            min-width: 1.5em;
            padding: 0 0.25em;
            text-align: center;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.4;
            border: 1px solid oklch(var(--fg-color) / 0.5);
            border-bottom-width: 3px;
            border-radius: 3px;
            background: oklch(var(--fg-color) / 0.1);
            margin-left: 0.25em;
            vertical-align: middle;
          }
          @media (hover: hover) and (pointer: fine) {
            kbd {
              display: inline-block;
            }
          }

          .panel {
            padding: 4px;
            border-radius: 4px;
            background: oklch(var(--fg-color) / 0.1);
            display: flex;
            flex-direction: column;
            gap: 4px;
          }

          .small-screen-actions {
            display: none;
          }
          @media (max-width: 640px) {
            aside {
              top: auto;
              bottom: 0;
              left: 0;
              right: 0;
              width: 100%;
              max-height: var(--small-screen-sheet-height);
              padding: 8px 8px max(8px, env(safe-area-inset-bottom));
              border-radius: 12px 12px 0 0;
              overscroll-behavior: contain;
              display: flex;
              flex-direction: column;
              gap: 8px;
              border: 1px solid oklch(var(--fg-color) / 0.12);
              background: oklch(var(--bg-color) / 0.75);
              backdrop-filter: blur(8px);
            }
            .tile-grid {
              gap: 4px;
            }
            .small-screen-actions-container {
              z-index: 11;
              position: absolute;
              inset-inline: 8px;
              gap: 8px;
              display: flex;
              justify-content: space-between;
              flex-wrap: wrap;
              bottom: calc(var(--small-screen-sheet-height) + 8px);
              pointer-events: none;
            }
            .small-screen-actions {
              display: flex;
              gap: 4px
            }
            :where(.small-screen-actions) button {
              pointer-events: auto;
              background: oklch(var(--bg-color) / 0.5);
              backdrop-filter: blur(8px);
              border: 1px solid oklch(var(--fg-color) / 0.25);
              padding: 0 0.75rem;
              min-height: 44px;
              border-radius: 4px;
              &:not(:disabled):hover {
                background: oklch(var(--bg-color) / 0.4);
              }
            }
            /* hide original Import/Screenshot/Record buttons inside aside on small screens (floating actions shown instead), keep Export select visible */
            aside .action-buttons > button {
              display: none;
            }
          }

          .drop-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: oklch(var(--bg-color) / 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: none;
          }
        `;

        constructor() {
          super();
          this.selectedModelPath = DEFAULT_MODEL;
          this.motionGroups = [];
          this.selectedGroup = "";
          this.motions = [];
          this.selectedMotion = "";
          this.expressions = [];
          this.selectedExpression = "";
          this.scale = 0.9;
          this.resolution = "device";
          this.exportResolution = "viewport";
          this.customWidth = 1920;
          this.customHeight = 1080;
          this.showFramingPreview = true;
          this.mouseTracking = false;
          this.statusMsg = "Initializing Live2D engine...";
          this.isDragging = false;
          this.isRecording = false;
          this.panX = 0;
          this.panY = 0;

          this.app = null;
          this.currentModel = null;
          this.currentModelJson = null;
          this.overlayGraphics = null;
          this.mediaRecorder = null;
          this.recordedChunks = [];
          this.isPanning = false;

          this.touchPointers = new Map();
          this.initialPinchDist = 0;
          this.initialScaleOnPinch = 0.9;
          this.initialPinchMid = { x: 0, y: 0 };
          this.initialPanOnPinch = { x: 0, y: 0 };
        }

        firstUpdated() {
          this.initPixi();
          this.loadModelSource(this.selectedModelPath);
          this.setupDragAndDrop();
          this.setupPanListeners();
          this.setupZoomListeners();
          this.setupKeyboardShortcuts();
        }

        initPixi() {
          const container = this.shadowRoot.querySelector("#viewport");
          this.app = new PIXI.Application({
            resizeTo: this,
            resolution: this.getResolutionValue(),
            autoDensity: true,
            antialias: true,
            backgroundAlpha: 0,
            preserveDrawingBuffer: true
          });

          container.appendChild(this.app.view);
          window.addEventListener("resize", () => this.resizeRenderer());
        }

        setupPanListeners() {
          const container = this.shadowRoot.querySelector("#viewport");
          let startX = 0,
            startY = 0,
            initialPanX = 0,
            initialPanY = 0;

          container.addEventListener("pointerdown", (e) => {
            if (e.button !== 0 && e.pointerType === "mouse") return;
            this.touchPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (this.touchPointers.size === 1) {
              this.isPanning = true;
              startX = e.clientX;
              startY = e.clientY;
              initialPanX = this.panX;
              initialPanY = this.panY;
            } else if (this.touchPointers.size === 2) {
              const pts = Array.from(this.touchPointers.values());
              this.initialPinchDist = Math.hypot(
                pts[0].x - pts[1].x,
                pts[0].y - pts[1].y
              );
              this.initialScaleOnPinch = this.scale;
              this.initialPinchMid = {
                x: (pts[0].x + pts[1].x) / 2,
                y: (pts[0].y + pts[1].y) / 2
              };
              this.initialPanOnPinch = { x: this.panX, y: this.panY };
              this.isPanning = true;
              startX = this.initialPinchMid.x;
              startY = this.initialPinchMid.y;
              initialPanX = this.panX;
              initialPanY = this.panY;
            }
            try {
              container.setPointerCapture(e.pointerId);
            } catch {}
          });

          container.addEventListener("pointermove", (e) => {
            if (this.touchPointers.has(e.pointerId)) {
              this.touchPointers.set(e.pointerId, {
                x: e.clientX,
                y: e.clientY
              });
            }

            if (this.touchPointers.size === 2) {
              const pts = Array.from(this.touchPointers.values());
              const currentDist = Math.hypot(
                pts[0].x - pts[1].x,
                pts[0].y - pts[1].y
              );
              const currentMid = {
                x: (pts[0].x + pts[1].x) / 2,
                y: (pts[0].y + pts[1].y) / 2
              };
              if (this.initialPinchDist > 0) {
                this.scale = Math.min(
                  40,
                  Math.max(
                    0.1,
                    Number(
                      (
                        this.initialScaleOnPinch *
                        (currentDist / this.initialPinchDist)
                      ).toFixed(3)
                    )
                  )
                );
              }
              this.panX = Math.round(
                this.initialPanOnPinch.x +
                  (currentMid.x - this.initialPinchMid.x)
              );
              this.panY = Math.round(
                this.initialPanOnPinch.y +
                  (currentMid.y - this.initialPinchMid.y)
              );
              this.updateView();
              return;
            }

            if (!this.isPanning) return;
            this.panX = Math.round(initialPanX + (e.clientX - startX));
            this.panY = Math.round(initialPanY + (e.clientY - startY));
            this.updateView();
          });

          const stopPointer = (e) => {
            this.touchPointers.delete(e.pointerId);
            if (this.touchPointers.size < 2) this.initialPinchDist = 0;
            if (this.touchPointers.size === 0) this.isPanning = false;
            try {
              container.releasePointerCapture(e.pointerId);
            } catch {}
          };

          container.addEventListener("pointerup", stopPointer);
          container.addEventListener("pointercancel", stopPointer);
        }

        setupZoomListeners() {
          this.shadowRoot.querySelector("#viewport").addEventListener(
            "wheel",
            (e) => {
              e.preventDefault();
              const rect = this.getBoundingClientRect();
              const cursorX = e.clientX - rect.left;
              const cursorY = e.clientY - rect.top;
              const frame = this.getFrameBounds();
              const oldScale = this.scale;
              // logarithmic zoom: scale multiplies exponentially with wheel delta
              // normalize deltaMode (0=pixel, 1=line, 2=page)
              let deltaY = e.deltaY;
              if (e.deltaMode === 1) deltaY *= 16;
              else if (e.deltaMode === 2) deltaY *= 400;
              const zoomSpeed = 0.001;
              let newScale = oldScale * Math.exp(-deltaY * zoomSpeed);
              newScale = Math.min(40, Math.max(0.1, newScale));
              // snap very close values to avoid drift; keep 2 decimals for display
              newScale = Number(newScale.toFixed(3));
              if (newScale === oldScale) return;
              const ratio = newScale / oldScale;
              const cx = frame.x + frame.width / 2 + this.panX;
              const cy = frame.y + frame.height / 2 + this.panY;
              this.panX = Math.round(this.panX + (cursorX - cx) * (1 - ratio));
              this.panY = Math.round(this.panY + (cursorY - cy) * (1 - ratio));
              this.scale = newScale;
              this.updateView();
            },
            { passive: false }
          );
        }

        setupKeyboardShortcuts() {
          window.addEventListener("keydown", (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const tag = document.activeElement?.tagName;
            const isTyping =
              tag === "INPUT" ||
              tag === "TEXTAREA" ||
              tag === "SELECT" ||
              document.activeElement?.isContentEditable;
            if (isTyping) return;
            const key = e.key.toLowerCase();
            if (key === "i") {
              e.preventDefault();
              this.shadowRoot.querySelector("#zipInput")?.click();
            } else if (key === "r") {
              e.preventDefault();
              this.toggleRecording();
            } else if (key === "f") {
              e.preventDefault();
              this.captureScreenshot();
            }
          });
        }

        updateView() {
          if (this.isRecording) {
            const target = this.getExportDimensions();
            this.renderModelForExport(target.width, target.height);
          } else {
            this.fitModel();
          }
        }

        resetView() {
          this.panX = 0;
          this.panY = 0;
          this.scale = 0.9;
          this.fitModel();
        }

        getResolutionValue() {
          return this.resolution === "device"
            ? Math.max(1, window.devicePixelRatio || 1)
            : Number.parseFloat(this.resolution) || 1;
        }

        isSmallScreen() {
          return window.matchMedia("(max-width: 640px)").matches;
        }

        getSmallScreenSheetHeightPx() {
          const raw = getComputedStyle(this).getPropertyValue("--small-screen-sheet-height").trim() || "35vh";
          if (raw.endsWith("vh")) return Math.round((parseFloat(raw) / 100) * this.clientHeight);
          if (raw.endsWith("px")) return Math.round(parseFloat(raw));
          if (raw.endsWith("dvh") || raw.endsWith("svh") || raw.endsWith("lvh"))
            return Math.round((parseFloat(raw) / 100) * this.clientHeight);
          const n = parseFloat(raw);
          return Number.isFinite(n) ? Math.round(n) : Math.round(this.clientHeight * 0.35);
        }

        getVisibleViewportHeight() {
          if (this.isSmallScreen()) {
            return Math.max(0, this.clientHeight - this.getSmallScreenSheetHeightPx());
          }
          return this.clientHeight;
        }

        getExportDimensions() {
          if (this.exportResolution === "720p")
            return { width: 1280, height: 720 };
          if (this.exportResolution === "1080p")
            return { width: 1920, height: 1080 };
          if (this.exportResolution === "4k")
            return { width: 3840, height: 2160 };
          if (this.exportResolution === "custom")
            return {
              width: Math.max(100, this.customWidth || 1920),
              height: Math.max(100, this.customHeight || 1080)
            };
          // on small screens viewport export should not include area underneath the floating sheet
          if (this.isSmallScreen()) {
            return { width: this.clientWidth, height: this.getVisibleViewportHeight() };
          }
          return { width: this.clientWidth, height: this.clientHeight };
        }

        getFrameBounds() {
          const vw = this.clientWidth,
            vh = this.isSmallScreen()
              ? this.getVisibleViewportHeight()
              : this.clientHeight;
          if (this.exportResolution === "viewport")
            return { x: 0, y: 0, width: vw, height: vh };

          const target = this.getExportDimensions();
          const targetAR = target.width / target.height,
            viewportAR = vw / vh;
          let frameW = vw,
            frameH = vh;

          if (viewportAR > targetAR) frameW = vh * targetAR;
          else frameH = vw / targetAR;

          return {
            x: (vw - frameW) / 2,
            y: (vh - frameH) / 2,
            width: frameW,
            height: frameH
          };
        }

        updateFramingOverlay() {
          if (!this.app) return;
          if (!this.overlayGraphics) {
            this.overlayGraphics = new PIXI.Graphics();
            this.app.stage.addChild(this.overlayGraphics);
          }

          this.app.stage.setChildIndex(
            this.overlayGraphics,
            this.app.stage.children.length - 1
          );
          this.overlayGraphics.clear();

          if (
            !this.showFramingPreview ||
            this.exportResolution === "viewport" ||
            this.isRecording
          )
            return;

          const frame = this.getFrameBounds(),
            vw = this.clientWidth,
            vh = this.isSmallScreen() ? this.getVisibleViewportHeight() : this.clientHeight;

          this.overlayGraphics.beginFill(0x000000, 0.55);
          if (frame.y > 0) this.overlayGraphics.drawRect(0, 0, vw, frame.y);
          if (frame.y + frame.height < vh)
            this.overlayGraphics.drawRect(
              0,
              frame.y + frame.height,
              vw,
              vh - (frame.y + frame.height)
            );
          if (frame.x > 0)
            this.overlayGraphics.drawRect(0, frame.y, frame.x, frame.height);
          if (frame.x + frame.width < vw)
            this.overlayGraphics.drawRect(
              frame.x + frame.width,
              frame.y,
              vw - (frame.x + frame.width),
              frame.height
            );
          this.overlayGraphics.endFill();

          // Primary colour
          this.overlayGraphics.lineStyle(2, 0x10cfcc, 0.9);
          this.overlayGraphics.drawRect(
            frame.x,
            frame.y,
            frame.width,
            frame.height
          );
        }

        fitModel() {
          if (!this.currentModel) return;
          this.currentModel.scale.set(1);
          const bounds = this.currentModel.getLocalBounds();
          this.currentModel.pivot.set(
            bounds.x + bounds.width / 2,
            bounds.y + bounds.height / 2
          );

          const frame = this.getFrameBounds();
          const scaleRatio =
            Math.min(frame.width / bounds.width, frame.height / bounds.height) *
            this.scale;

          this.currentModel.scale.set(scaleRatio);
          this.currentModel.position.set(
            frame.x + frame.width / 2 + this.panX,
            frame.y + frame.height / 2 + this.panY
          );
          this.updateFramingOverlay();
        }

        renderModelForExport(exportW, exportH) {
          if (!this.currentModel) return;
          const frame = this.getFrameBounds();
          const scaleMultiplier = exportH / frame.height;

          this.currentModel.scale.set(1);
          const bounds = this.currentModel.getLocalBounds();
          this.currentModel.pivot.set(
            bounds.x + bounds.width / 2,
            bounds.y + bounds.height / 2
          );

          const baseScaleRatio =
            Math.min(frame.width / bounds.width, frame.height / bounds.height) *
            this.scale;
          this.currentModel.scale.set(baseScaleRatio * scaleMultiplier);
          this.currentModel.position.set(
            exportW / 2 + this.panX * scaleMultiplier,
            exportH / 2 + this.panY * scaleMultiplier
          );
        }

        async captureScreenshot() {
          if (!this.app || !this.currentModel) return;
          const target = this.getExportDimensions();
          const origW = this.clientWidth,
            origH = this.clientHeight,
            origRes = this.app.renderer.resolution;

          if (this.overlayGraphics) this.overlayGraphics.visible = false;

          this.app.renderer.resolution = 1;
          this.app.renderer.resize(target.width, target.height);
          this.renderModelForExport(target.width, target.height);
          this.app.render();

          const link = document.createElement("a");
          link.download = `live2d-snapshot-${target.width}x${target.height}-${Date.now()}.png`;
          link.href = this.app.view.toDataURL("image/png");
          link.click();

          this.app.renderer.resolution = origRes;
          this.app.renderer.resize(origW, origH);
          if (this.overlayGraphics) this.overlayGraphics.visible = true;
          this.fitModel();

          this.statusMsg = `Saved screenshot (${target.width}x${target.height})`;
        }

        toggleRecording() {
          if (this.isRecording) {
            if (this.mediaRecorder) this.mediaRecorder.stop();
            this.isRecording = false;
          } else {
            this.startRecording();
          }
        }

        startRecording() {
          if (!this.app || !this.currentModel) return;

          const target = this.getExportDimensions();
          if (this.overlayGraphics) this.overlayGraphics.visible = false;

          this.app.renderer.resolution = 1;
          this.app.renderer.resize(target.width, target.height);
          this.renderModelForExport(target.width, target.height);

          this.recordedChunks = [];
          let mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
            ? "video/webm;codecs=vp9"
            : "video/webm";

          this.mediaRecorder = new MediaRecorder(
            this.app.view.captureStream(60),
            { mimeType }
          );
          this.mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) this.recordedChunks.push(e.data);
          };
          this.mediaRecorder.onstop = () => {
            const blob = new Blob(this.recordedChunks, { type: mimeType });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `live2d-recording-${target.width}x${target.height}-${Date.now()}.webm`;
            a.click();

            this.app.renderer.resolution = this.getResolutionValue();
            this.app.renderer.resize(this.clientWidth, this.clientHeight);
            if (this.overlayGraphics) this.overlayGraphics.visible = true;
            this.fitModel();
            this.statusMsg = "Video export complete!";
          };

          this.mediaRecorder.start();
          this.isRecording = true;
          this.statusMsg = `Recording video (${target.width}x${target.height})...`;
        }

        async loadModelSource(source) {
          this.statusMsg = `Loading model...`;

          if (this.currentModel) {
            this.app.stage.removeChild(this.currentModel);
            this.currentModel.destroy({ children: true });
            this.currentModel = null;
          }

          try {
            if (typeof source === "string") {
              const res = await fetch(source);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              this.currentModelJson = await res.json();
              this.populateMotionsAndExpressions();
              this.currentModel = await PIXI.live2d.Live2DModel.from(source, {
                autoInteract: this.mouseTracking
              });
            } else if (Array.isArray(source)) {
              const modelFile = source.find(
                (f) =>
                  f.name.endsWith(".model3.json") ||
                  f.name.endsWith(".model.json")
              );
              if (!modelFile) throw new Error("No model settings file found!");
              this.currentModelJson = JSON.parse(await modelFile.text());
              this.populateMotionsAndExpressions();
              this.currentModel = await PIXI.live2d.Live2DModel.from(source, {
                autoInteract: this.mouseTracking
              });
            }

            this.app.stage.addChild(this.currentModel);
            this.fitModel();
            this.playMotion();
            this.statusMsg = `Loaded model successfully!`;
          } catch (err) {
            console.error(err);
            this.statusMsg = `Load failed: ${err.message || err}`;
          }
        }

        populateMotionsAndExpressions() {
          const fileRefs = this.currentModelJson?.FileReferences || {};

          this.motionGroups = Object.keys(fileRefs.Motions || {});
          this.selectedGroup = this.motionGroups[0] || "";
          this.updateMotionList();

          this.expressions = (fileRefs.Expressions || []).map((e, idx) => ({
            name:
              e.Name ||
              (e.File
                ? e.File.split("/").pop().replace(".exp3.json", "")
                : `Expr ${idx}`),
            value: String(idx)
          }));
          this.selectedExpression = this.expressions[0]?.value || "";
        }

        updateMotionList() {
          const groupItems =
            (this.currentModelJson?.FileReferences?.Motions || {})[
              this.selectedGroup
            ] || [];
          this.motions = groupItems.map((m, idx) => ({
            label: m.File
              ? m.File.split("/").pop().replace(".motion3.json", "")
              : `Motion ${idx}`,
            value: String(idx)
          }));
          this.selectedMotion = this.motions[0]?.value || "";
        }

        playMotion() {
          if (!this.currentModel || !this.selectedGroup || !this.selectedMotion)
            return;
          const index = Number.parseInt(this.selectedMotion, 10);
          if (!Number.isNaN(index))
            this.currentModel.motion(
              this.selectedGroup,
              index,
              PIXI.live2d.MotionPriority.FORCE
            );
        }

        playExpression() {
          if (!this.currentModel || !this.selectedExpression) return;
          const index = Number.parseInt(this.selectedExpression, 10);
          if (!Number.isNaN(index)) this.currentModel.expression(index);
        }

        resizeRenderer() {
          if (!this.app || this.isRecording) return;
          this.app.renderer.resolution = this.getResolutionValue();
          this.app.renderer.resize(this.clientWidth, this.clientHeight);
          this.fitModel();
        }

        setupDragAndDrop() {
          this.addEventListener("dragover", (e) => {
            e.preventDefault();
            this.isDragging = true;
          });
          this.addEventListener("dragleave", (e) => {
            if (!this.contains(e.relatedTarget)) this.isDragging = false;
          });
          this.addEventListener("drop", async (e) => {
            e.preventDefault();
            this.isDragging = false;
            const files = e.dataTransfer?.files;
            if (files && files.length) await this.processDroppedFile(files[0]);
          });
        }

        async processDroppedFile(file) {
          if (!file.name.toLowerCase().endsWith(".zip")) return;
          this.statusMsg = `Extracting ZIP: ${file.name}...`;
          try {
            const zip = await JSZip.loadAsync(file);
            const modelKey = Object.keys(zip.files).find(
              (k) =>
                !zip.files[k].dir &&
                (k.endsWith(".model3.json") || k.endsWith(".model.json"))
            );
            if (!modelKey)
              throw new Error("No .model3.json or .model.json found in ZIP!");

            const lastSlashIndex = modelKey.lastIndexOf("/");
            const baseDir =
              lastSlashIndex >= 0
                ? modelKey.substring(0, lastSlashIndex + 1)
                : "";
            const normalizedFiles = [];

            for (const [path, entry] of Object.entries(zip.files)) {
              if (entry.dir || (baseDir && !path.startsWith(baseDir))) continue;
              const relPath = baseDir ? path.substring(baseDir.length) : path;
              const fileObj = new File([await entry.async("blob")], relPath);
              Object.defineProperty(fileObj, "webkitRelativePath", {
                value: relPath,
                writable: false
              });
              normalizedFiles.push(fileObj);
            }

            await this.loadModelSource(normalizedFiles);
          } catch (err) {
            this.statusMsg = `ZIP load failed: ${err.message || err}`;
          }
        }

        handleTileKeydown(e, items, selectedValue, onSelect, getValue) {
          const cols = Math.max(
            1,
            Math.floor(e.currentTarget.offsetWidth / 100)
          );
          const vals = items.map((i) => (getValue ? getValue(i) : i));
          const idx = vals.indexOf(selectedValue);
          if (idx === -1) return;
          let next = idx;
          if (e.key === "ArrowRight") next = Math.min(vals.length - 1, idx + 1);
          else if (e.key === "ArrowLeft") next = Math.max(0, idx - 1);
          else if (e.key === "ArrowDown")
            next = Math.min(vals.length - 1, idx + cols);
          else if (e.key === "ArrowUp") next = Math.max(0, idx - cols);
          else return;
          e.preventDefault();
          onSelect(vals[next]);
          this.updateComplete.then(() => {
            const btns = e.currentTarget.querySelectorAll(".tile-btn");
            btns[next]?.focus();
          });
        }
        renderTileGrid(items, selectedValue, onSelect, getLabel, getValue) {
          return html`
            <div
              class="tile-grid"
              @keydown=${(e) => this.handleTileKeydown(e, items, selectedValue, onSelect, getValue)}
            >
              ${
                items.length
                  ? items.map((item) => {
                      const val = getValue ? getValue(item) : item;
                      const lbl = getLabel ? getLabel(item) : item;
                      return html`
                        <button
                          type="button"
                          class="tile-btn ${selectedValue === val ? "active" : ""}"
                          title=${lbl}
                          @click=${() => onSelect(val)}
                        >
                          ${lbl}
                        </button>
                      `;
                    })
                  : html`
                      <div class="empty-state">None available</div>
                    `
              }
            </div>
          `;
        }

        render() {
          return html`
            <section id="viewport"></section>

            ${
              this.isDragging
                ? html`
                    <div class="drop-overlay"><span>Drop ZIP file</span></div>
                  `
                : ""
            }

            <aside>
              <section class="panel">
                <div class="control-group">
                  <span class="section-label">Motion Group</span>
                  ${this.renderTileGrid(
                    this.motionGroups,
                    this.selectedGroup,
                    (g) => {
                      this.selectedGroup = g;
                      this.updateMotionList();
                      this.playMotion();
                    }
                  )}
                </div>
                <div class="control-group">
                  <span class="section-label">Motion</span>
                  ${this.renderTileGrid(
                    this.motions,
                    this.selectedMotion,
                    (mVal) => {
                      this.selectedMotion = mVal;
                      this.playMotion();
                    },
                    (m) => m.label,
                    (m) => m.value
                  )}
                </div>
                <div class="control-group">
                  <span class="section-label">Expression</span>
                  ${this.renderTileGrid(
                    this.expressions,
                    this.selectedExpression,
                    (xVal) => {
                      this.selectedExpression = xVal;
                      this.playExpression();
                    },
                    (x) => x.name,
                    (x) => x.value
                  )}
                </div>
              </section>

              <section class="panel">
                <div class="action-buttons">
                  <button
                    type="button"
                    class="drop-btn"
                    @click=${() => this.shadowRoot.querySelector("#zipInput").click()}
                  >
                    Import
                    <kbd>I</kbd>
                  </button>
                  <button type="button" @click=${this.captureScreenshot}>
                    Screenshot
                    <kbd>F</kbd>
                  </button>
                  <button type="button" @click=${this.toggleRecording}>
                    ${this.isRecording ? "Stop recording" : "Start recording"}
                    <kbd>R</kbd>
                  </button>
                  <div class="input-item">
                    <label for="exportResolutionSelect">Export</label>
                    <select
                      id="exportResolutionSelect"
                      .value=${this.exportResolution}
                      @change=${(e) => {
                      this.exportResolution = e.target.value;
                      this.fitModel();
                    }}
                    >
                      <option value="viewport">Viewport</option>
                      <option value="720p">720p</option>
                      <option value="1080p">1080p</option>
                      <option value="4k">4K</option>
                      <option value="custom">Custom</option>
                    </select>
                  </div>
                </div>
                ${
                  this.exportResolution === "custom"
                    ? html`
                        <div class="row-custom">
                          <div class="input-item">
                            <label for="customW">Width</label>
                            <input
                              id="customW"
                              type="number"
                              min="100"
                              .value=${this.customWidth}
                              @input=${(e) => {
                                this.customWidth =
                                  Number.parseInt(e.target.value, 10) || 1920;
                                this.fitModel();
                              }}
                            />
                          </div>
                          <div class="input-item">
                            <label for="customH">Height</label>
                            <input
                              id="customH"
                              type="number"
                              min="100"
                              .value=${this.customHeight}
                              @input=${(e) => {
                                this.customHeight =
                                  Number.parseInt(e.target.value, 10) || 1080;
                                this.fitModel();
                              }}
                            />
                          </div>
                        </div>
                      `
                    : ""
                }
                <input
                  id="zipInput"
                  type="file"
                  accept=".zip"
                  hidden
                  @change=${(e) => {
                  const file = e.target.files?.[0];
                  if (file) this.processDroppedFile(file);
                }}
                />
                <div class="control-group">
                  <span class="section-label">Camera</span>
                  <div class="row-group">
                    <div class="input-item">
                      <label for="panXInput">X</label>
                      <input
                        id="panXInput"
                        type="number"
                        .value=${this.panX}
                        @input=${(e) => {
                      this.panX = Number.parseFloat(e.target.value) || 0;
                      this.fitModel();
                    }}
                      />
                    </div>
                    <div class="input-item">
                      <label for="panYInput">Y</label>
                      <input
                        id="panYInput"
                        type="number"
                        .value=${this.panY}
                        @input=${(e) => {
                      this.panY = Number.parseFloat(e.target.value) || 0;
                      this.fitModel();
                    }}
                      />
                    </div>
                    <div class="input-item">
                      <label for="scaleInput">Scale</label>
                      <input
                        id="scaleInput"
                        type="number"
                        min="0.1"
                        step="0.05"
                        .value=${this.scale}
                        @input=${(e) => {
                      this.scale = Number.parseFloat(e.target.value) || 0.9;
                      this.fitModel();
                    }}
                      />
                    </div>
                    <button type="button" @click=${this.resetView}>
                      Reset
                    </button>
                  </div>
                </div>
              </section>

              <details class="panel">
                <summary>Advanced</summary>
                <div class="input-item">
                  <label for="displayResolutionSelect">Resolution scale</label>
                  <select
                    id="displayResolutionSelect"
                    .value=${this.resolution}
                    @change=${(e) => {
                      this.resolution = e.target.value;
                      this.resizeRenderer();
                    }}
                  >
                    <option value="device">Device</option>
                    <option value="1">1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                    <option value="2.5">2.5x</option>
                    <option value="3">3x</option>
                  </select>
                </div>
                <div class="control-group">
                  <div class="toggle-row">
                    <label for="showPreview">Framing guide</label>
                    <input
                      id="showPreview"
                      class="checkbox-custom"
                      type="checkbox"
                      .checked=${this.showFramingPreview}
                      @change=${(e) => {
                      this.showFramingPreview = e.target.checked;
                      this.updateFramingOverlay();
                    }}
                    />
                  </div>
                  <div class="toggle-row">
                    <label for="mouseTrack">Mouse tracking</label>
                    <input
                      id="mouseTrack"
                      class="checkbox-custom"
                      type="checkbox"
                      .checked=${this.mouseTracking}
                      @change=${(e) => {
                      this.mouseTracking = e.target.checked;
                      this.loadModelSource(this.selectedModelPath);
                    }}
                    />
                  </div>
                </div>
              </details>
            </aside>

            <div class="small-screen-actions-container">
              <div class="small-screen-actions">
              <button type="button" class="drop-btn" @click=${() => this.shadowRoot.querySelector("#zipInput").click()}>Import <kbd>I</kbd></button>
            </div>
            <div class="small-screen-actions">
              <button type="button" @click=${this.captureScreenshot}>Screenshot <kbd>F</kbd></button>
              <button type="button" @click=${this.toggleRecording}>${this.isRecording ? "Stop" : "Record"} <kbd>R</kbd></button>
            </div>
            </div>

            <footer role="status">${this.statusMsg}</footer>
          `;
        }
      }

      customElements.define("live2d-viewer", Live2DViewer);
    </script>
  </body>
</html>
